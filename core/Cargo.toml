[package]
name = "melange-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cec = []

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
evdev = "0.12"
futures-util = "0.3"
gilrs = "0.11"
mime_guess = "2"
qrcode = "0.14"
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["json"] }
rodio = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "process"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
tower = "0.5"
